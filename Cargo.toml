[package]
name = "dede-tv-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Persistent, deterministic virtual live-TV channel scheduling"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
